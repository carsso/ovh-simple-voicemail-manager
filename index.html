<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Voicemail</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/style.css">
    <script>
        // Runs before first paint so the page never flashes the wrong theme.
        // No stored preference means "follow the system", which is the default.
        (function () {
            var pref = localStorage.getItem("theme");
            var sys = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.dataset.theme = (pref === "light" || pref === "dark") ? pref : sys;
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-row">
            <div class="brand">
                <h1 data-i18n="appTitle">Voicemail</h1>
                <span id="line-title" class="line-title"></span>
                <div id="summary" class="summary" role="status" aria-live="polite"></div>
            </div>

            <div class="topbar-actions">
                <div class="segmented" role="group" data-i18n-aria="filterAria" aria-label="Filter messages">
                    <button type="button" class="seg is-active" data-filter="inbox" data-i18n="filterInbox">Inbox</button>
                    <button type="button" class="seg" data-filter="archived" data-i18n="filterArchived">Archive</button>
                </div>
                <button id="refresh" type="button" class="btn" data-i18n-title="refreshTitle">
                    <span class="btn-icon" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                    </span>
                    <span class="btn-label" data-i18n="refresh">Refresh</span>
                </button>
                <button id="theme" type="button" class="btn btn-icon-only"></button>
            </div>
        </div>

        <div id="lines" class="lines" role="group" data-i18n-aria="linesAria" aria-label="Pick a line" hidden></div>
        <div class="refresh-track" aria-hidden="true"><div id="refresh-progress"></div></div>
    </header>

    <main>
        <p id="banner" class="banner" role="alert" hidden></p>
        <ul id="messages" class="messages"></ul>
        <p id="empty" class="placeholder" data-i18n="empty" hidden></p>
        <p id="no-match" class="placeholder" data-i18n="noMatchInbox" hidden></p>
    </main>

    <script type="module" src="assets/app.js"></script>
</body>
</html>
